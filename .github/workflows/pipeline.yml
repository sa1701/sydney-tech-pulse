name: Daily pipeline

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 07:00 Sydney (AEST)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Run the 30-day backfill instead of the daily pull"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        working-directory: pipeline
        env:
          PYTHONPATH: src
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pulse.run ${{ inputs.backfill && '--backfill' || '' }}
