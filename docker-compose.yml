# Local dev: `docker compose up db` then run the pipeline against it.
# Local runs never touch the production (Supabase) database.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 3s
      timeout: 3s
      retries: 10

  pipeline:
    build: ./pipeline
    environment:
      DATABASE_URL: postgresql://pulse:pulse@db:5432/pulse
      ADZUNA_APP_ID: ${ADZUNA_APP_ID}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
